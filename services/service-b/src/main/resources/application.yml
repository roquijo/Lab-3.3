server:
  port: ${SERVER_PORT:8081}

spring:
  application:
    name: service-b
  main:
    banner-mode: off

lab:
  data-service-url: ${DATA_SERVICE_URL:http://localhost:8082}
  api-token: ${LAB_API_TOKEN:lab33-local-token}
  chaos:
    armed: ${CHAOS_ARMED:false}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true
