server:
  port: ${SERVER_PORT:8082}

spring:
  application:
    name: data-service
  main:
    banner-mode: off
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  datasource:
    username: ${SPRING_DATASOURCE_USERNAME:lab}
    password: ${SPRING_DATASOURCE_PASSWORD:lab33-local}
    hikari:
      maximum-pool-size: 5
      pool-name: data-service-pool
---
spring:
  config:
    activate:
      on-profile: local
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:13306/lab33?useSSL=false&allowPublicKeyRetrieval=true&characterEncoding=utf8&serverTimezone=UTC}
---
spring:
  config:
    activate:
      on-profile: gcp
  datasource:
    url: ${CLOUD_SQL_JDBC_URL}
---
spring:
  config:
    activate:
      on-profile: aws
  datasource:
    url: ${RDS_JDBC_URL}

lab:
  api-token: ${LAB_API_TOKEN:lab33-local-token}
  chaos:
    armed: ${CHAOS_ARMED:false}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true
