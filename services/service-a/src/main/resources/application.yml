server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: service-a
  main:
    banner-mode: off

lab:
  service-b-url: ${SERVICE_B_URL:http://localhost:8081}
  api-token: ${LAB_API_TOKEN:lab33-local-token}
  chaos:
    armed: ${CHAOS_ARMED:false}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true
