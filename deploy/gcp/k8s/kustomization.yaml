apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: lab33
resources:
  - namespace.yaml
  - mysql.yaml
  - collector.yaml
  - services.yaml
generatorOptions:
  disableNameSuffixHash: true
configMapGenerator:
  - name: otel-collector-config
    files:
      - config.yaml=../../../observability/collector/collector-gcp.yaml
  - name: mysql-init
    files:
      - init.sql=../../local/mysql/init.sql
images:
  - name: lab33/service-a
    newName: REGION-docker.pkg.dev/PROJECT_ID/lab33/service-a
    newTag: "1.0.0"
  - name: lab33/service-b
    newName: REGION-docker.pkg.dev/PROJECT_ID/lab33/service-b
    newTag: "1.0.0"
  - name: lab33/data-service
    newName: REGION-docker.pkg.dev/PROJECT_ID/lab33/data-service
    newTag: "1.0.0"
